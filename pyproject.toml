[project]
name = "c"
version = "0.1.0"
description = "Trial cocotb design project"
authors = [
    {name = "Stephen Henry",email = "stephenry@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cocotb (>=2.0.1,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "tb", from = "src" },
    { include = "syn", from = "src" }
]

[tool.poetry.scripts]
clean = "clean.cli:main"
driver = "tb.cli:main"
regress = "tb.regress:run"
synsweep = "syn.cli:run_sweep"
syn = "syn.cli:syn"
lint = "lint.cli:lint_all_svlint"
vlint = "lint.cli:lint_all_verilator"

[dependency-groups]
dev = [
    "black (>=25.12.0,<26.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)"
]
